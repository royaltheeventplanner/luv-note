
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Patootie ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;text-align:center;
 background:linear-gradient(135deg,#ffe1eb,#fff5f8,#ffd0df);
 font-family:Georgia,serif;color:#8d2850;overflow:hidden;
}
.card{
 background:#ffffffd9;padding:38px 24px;border-radius:28px;
 width:88%;max-width:420px;box-shadow:0 12px 40px #d66b8b40;
 position:relative;z-index:2;
}
h1{font-size:30px;margin:0 0 25px}
p{font-size:19px;line-height:1.7}
.love{font-size:25px;font-weight:bold;margin-top:25px}
.heart{position:absolute;bottom:-30px;font-size:22px;
 animation:float 7s linear infinite;opacity:.7}
@keyframes float{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="card">
<h1>Hey, My Patootie! 💗</h1>
<p>
No refunds, no exchange, no return,<br>
You're my favourite person, that's my concern! 💗
</p>
<div class="love">I LOVE YOU, Patootie! ❤️😘</div>
<p>More than you can imagine,<br>
and maybe a little more than you deserve! 😂💕</p>
</div>
<script>
for(let i=0;i<18;i++){
 let h=document.createElement('div');
 h.className='heart';h.textContent='💗';
 h.style.left=Math.random()*100+'%';
 h.style.animationDelay=Math.random()*7+'s';
 h.style.animationDuration=(5+Math.random()*5)+'s';
 document.body.appendChild(h);
}
</script>
</body>
</html>
